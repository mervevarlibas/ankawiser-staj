<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mwitter - Kayıt Ol</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="auth-page">

    <div class="floral-corner floral-top-left">
        <span class="flower flower-one">✿</span>
        <span class="flower flower-two">❀</span>
        <span class="leaf leaf-one">❧</span>
    </div>

    <div class="floral-corner floral-top-right">
        <span class="flower flower-one">✿</span>
        <span class="flower flower-two">❀</span>
        <span class="leaf leaf-one">❧</span>
    </div>  

    <div class="floral-corner floral-bottom-left">
        <span class="flower flower-one">✿</span>
        <span class="flower flower-two">❀</span>
        <span class="leaf leaf-one">❧</span>
    </div>

    <div class="floral-corner floral-bottom-right">
        <span class="flower flower-one">✿</span>
        <span class="flower flower-two">❀</span>
        <span class="leaf leaf-one">❧</span>
    </div>

    <main class="auth-container">

        <section class="auth-card register-card">

            <h1 class="brand-logo">Mwitter</h1>

            <p class="auth-subtitle">
                Yeni bir hesap oluştur ve dünyanı paylaş.
            </p>

            <form id="registerForm" class="auth-form">

                <label for="username">Kullanıcı adı</label>

                <input
                    type="text"
                    id="username"
                    placeholder="Kullanıcı adını gir"
                    autocomplete="username"
                    required
                >

                <label for="email">E-posta</label>

                <input
                    type="email"
                    id="email"
                    placeholder="E-posta adresini gir"
                    autocomplete="email"
                    required
                >

                <label for="phoneNumber">Telefon numarası</label>

                <input
                    type="tel"
                    id="phoneNumber"
                    placeholder="05xxxxxxxxx"
                    autocomplete="tel"
                    required
                >

                <label for="password">Şifre</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Şifreni oluştur"
                    autocomplete="new-password"
                    required
                >

                <button type="submit" class="primary-button">
                    Kayıt Ol
                </button>

            </form>

            <p id="message" class="form-message"></p>

            <p class="auth-switch">
                Zaten hesabın var mı?
                <a href="login.html">Giriş yap</a>
            </p>

        </section>

    </main>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/register.js"></script>

</body>

</html>
