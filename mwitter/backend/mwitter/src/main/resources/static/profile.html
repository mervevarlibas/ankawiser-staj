<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#7e2949">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Mwitter">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">

    <title>Mwitter - Profil</title>

    <link rel="stylesheet" href="css/style.css">
    <script src="js/theme.js" defer></script>
    <script src="js/pwa.js" defer></script>
</head>

<body class="home-page">

    <button type="button" id="themeToggle" class="theme-toggle">☾ Karanlık Mod</button>

    <div class="home-layout">

        <!-- SOL MENÜ (AYNI INDEX GİBİ) -->
        <aside class="left-sidebar">

            <div class="sidebar-inner">

                <a href="index.html" class="sidebar-logo">
                    Mwitter
                </a>

                <nav class="main-nav">

                    <a href="index.html" class="nav-item">
                        <span class="nav-icon">⌂</span>
                        <span>Ana Sayfa</span>
                    </a>

                    <a href="messages.html" class="nav-item">
                        <span class="nav-icon">✉</span>
                        <span>Sohbetler</span>
                    </a>

                    <a href="notifications.html" class="nav-item">
                        <span class="nav-icon">🔔</span><span>Bildirimler</span>
                        <span id="notificationBadge" class="nav-unread-badge" hidden>0</span>
                    </a>

                    <a href="#" id="profileLink" class="nav-item active">
                        <span class="nav-icon">♡</span>
                        <span>Profil</span>
                    </a>

                    <button type="button" class="nav-item nav-button" id="logoutButton">
                        <span class="nav-icon">↪</span>
                        <span>Çıkış Yap</span>
                    </button>

                </nav>

                <div class="sidebar-user-card">

                    <div class="avatar">
                        <span id="sidebarAvatarLetter">M</span>
                    </div>

                    <div class="sidebar-user-info">
                        <strong id="sidebarUsername">Kullanıcı</strong>
                        <small>Mwitter hesabı</small>
                    </div>

                </div>

            </div>

        </aside>

        <!-- ORTA ALAN -->
        <main class="feed-column">

            <header class="feed-header">

                <div>
                    <p class="eyebrow">Profil</p>
                    <h1 id="profileUsername">Kullanıcı</h1>
                    <!-- bunu js değiştircek-->
                </div>

            </header>

            <section class="profile-header">

                <div class="profile-banner"></div>

                <div class="profile-info">

                    <div class="profile-avatar">
                        <span id="profileAvatarLetter">M</span>
                    </div>

                    <div class="profile-text">
                        <h2 id="profileName">Kullanıcı</h2>
                        <p id="profileUsernameTag">@username</p>

                        <div class="profile-stats">
                            <span><strong id="followingCount">0</strong> Takip</span>
                            <span><strong id="followerCount">0</strong> Takipçi</span>
                        </div>
                    </div>

                    <button id="followButton" class="primary-button">
            Takip Et
        </button>
                    <button id="messageButton" class="primary-button" style="display:none;">
            Mesaj Gönder
        </button>
                    <button id="changePasswordButton" class="primary-button" style="display:none;">
    Şifre Değiştir
</button>
                </div>

            </section>

            <section class="timeline-section">

                <div class="section-title-row">
                    <h2>Gönderiler</h2>
                </div>

                <div id="profilePosts" class="timeline-list">
                    <!-- backendden gelen postlar buraya basılacak -->

                    <div class="loading-card">
                        Gönderiler yükleniyor...
                    </div>

                </div>

            </section>

        </main>

        <!-- SAĞ PANEL -->
        <aside class="right-sidebar">

            <div class="right-panel">

                <section class="suggestion-card">

                    <div class="section-title-row">
                        <h2>Profil</h2>
                    </div>

                    <p>
                        Kullanıcının paylaştığı gönderileri görüntülüyorsun.
                    </p>

                </section>

                <footer class="home-footer">
                    <span>Mwitter</span>
                    <span>·</span>
                    <span>2026</span>
                </footer>

            </div>

        </aside>

    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7/bundles/stomp.umd.min.js"></script>
    <script src="js/websocket-client.js"></script>
    <script src="js/notifications-badge.js"></script>
    <script src="js/mentions.js"></script>
    <script src="js/profile.js"></script>

    <div id="followListModal" class="modal-overlay" style="display:none;">
        <div class="modal-box">
            <div class="modal-header">
                <h3 id="followListTitle">Liste</h3>
                <button type="button" id="closeFollowListModal">&times;</button>
            </div>
            <div id="followListBody">
            </div>
        </div>
    </div>

    <div id="changePasswordModal" class="modal-overlay" style="display:none;">
        <div class="modal-box">
            <div class="modal-header">
                <h3>Şifre Değiştir</h3>
                <button type="button" id="closeChangePasswordModal">&times;</button>
            </div>

            <label for="oldPassword">Eski şifre</label>
            <input type="password" id="oldPassword" />

            <label for="newPassword">Yeni şifre</label>
            <input type="password" id="newPassword" />

            <label for="confirmNewPassword">Yeni şifre (tekrar)</label>
            <input type="password" id="confirmNewPassword" />

            <button type="button" id="submitChangePassword">Kaydet</button>
            <p id="changePasswordMessage"></p>
        </div>
    </div>
</body>

</html>
