<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#7e2949">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Mwitter">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <title>Mwitter - Şifre Sıfırla</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/theme.js" defer></script>
    <script src="js/pwa.js" defer></script>
</head>
<body class="auth-page">
    <button type="button" id="themeToggle" class="theme-toggle">☾ Karanlık Mod</button>
    <main class="auth-container">
        <section class="auth-card">
            <h1 class="brand-logo">Mwitter</h1>
            <p class="auth-subtitle">Hesabın için yeni bir şifre belirle.</p>
            <form id="resetPasswordForm" class="auth-form">
                <label for="newPassword">Yeni şifre</label>
                <input type="password" id="newPassword" minlength="6" autocomplete="new-password" required>
                <label for="confirmNewPassword">Yeni şifre (tekrar)</label>
                <input type="password" id="confirmNewPassword" minlength="6" autocomplete="new-password" required>
                <button type="submit" class="primary-button" id="resetPasswordButton">Şifreyi Sıfırla</button>
            </form>
            <p id="message" class="form-message" aria-live="polite"></p>
            <p class="auth-switch"><a href="login.html">Giriş sayfasına dön</a></p>
        </section>
    </main>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/reset-password.js"></script>
</body>
</html>
