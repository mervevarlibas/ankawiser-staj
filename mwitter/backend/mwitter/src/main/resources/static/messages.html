<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#7e2949">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Mwitter">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <title>Mwitter - Sohbetler</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/theme.js" defer></script>
    <script src="js/pwa.js" defer></script>
</head>
<body class="home-page messages-page">
    <button type="button" id="themeToggle" class="theme-toggle">☾ Karanlık Mod</button>

    <div class="home-layout messages-home-layout">
        <aside class="left-sidebar">
            <div class="sidebar-inner">
                <a href="index.html" class="sidebar-logo">Mwitter</a>
                <nav class="main-nav">
                    <a href="index.html" class="nav-item">
                        <span class="nav-icon">⌂</span><span>Ana Sayfa</span>
                    </a>
                    <a href="messages.html" class="nav-item active">
                        <span class="nav-icon">✉</span><span>Sohbetler</span>
                    </a>
                    <a href="notifications.html" class="nav-item">
                        <span class="nav-icon">🔔</span><span>Bildirimler</span>
                        <span id="notificationBadge" class="nav-unread-badge" hidden>0</span>
                    </a>
                    <a href="#" id="profileLink" class="nav-item">
                        <span class="nav-icon">♡</span><span>Profil</span>
                    </a>
                    <button type="button" class="nav-item nav-button" id="logoutButton">
                        <span class="nav-icon">↪</span><span>Çıkış Yap</span>
                    </button>
                </nav>
                <div class="sidebar-user-card">
                    <div class="avatar"><span id="sidebarAvatarLetter">M</span></div>
                    <div class="sidebar-user-info">
                        <strong id="sidebarUsername">Kullanıcı</strong>
                        <small>Mwitter hesabı</small>
                    </div>
                </div>
            </div>
        </aside>

        <main class="messages-shell">
            <aside class="conversation-panel">
                <header class="messages-panel-header">
                    <p class="eyebrow">Mesajlar</p>
                    <h1>Sohbetler</h1>
                </header>
                <div id="conversationList" class="conversation-list">
                    <div class="loading-card">Sohbetler yükleniyor...</div>
                </div>
            </aside>

            <section class="chat-panel">
                <header class="chat-header" id="chatHeader">
                    <div>
                        <p class="eyebrow">Bire bir sohbet</p>
                        <h2 id="chatUsername">Bir sohbet seç</h2>
                    </div>
                    <span id="connectionStatus" class="connection-status">Bağlanıyor...</span>
                </header>

                <div id="messageList" class="message-list">
                    <div class="chat-placeholder">Mesajlaşmaya başlamak için soldan bir sohbet seç.</div>
                </div>

                <form id="messageForm" class="message-composer" style="display:none;">
                    <textarea id="messageInput" maxlength="1000" rows="1"
                        placeholder="Mesajını yaz..." required></textarea>
                    <button type="submit" class="primary-button">Gönder</button>
                </form>
            </section>
        </main>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7/bundles/stomp.umd.min.js"></script>
    <script src="js/websocket-client.js"></script>
    <script src="js/notifications-badge.js"></script>
    <script src="js/messages.js"></script>
</body>
</html>
