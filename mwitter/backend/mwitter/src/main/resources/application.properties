spring.application.name=mwitter
spring.mongodb.uri=mongodb://localhost:27017/mwitterdb
jwt.expiration=86400000
spring.profiles.include=secret
# Şifre sıfırlama e-postasındaki bağlantının yayınlanan uygulama adresi.
app.base-url=${APP_BASE_URL:http://localhost:8080}
gmail.client-id=${GMAIL_CLIENT_ID}
gmail.client-secret=${GMAIL_CLIENT_SECRET}
gmail.refresh-token=${GMAIL_REFRESH_TOKEN}
gmail.from=${GMAIL_FROM}
# Actuator uçları doğrudan internete açılmaz; panel güvenli /admin/metrics yolunu kullanır.
management.endpoints.web.exposure.exclude=*
admin.email=${ADMIN_EMAIL:}
admin.password=${ADMIN_PASSWORD:}
admin.username=${ADMIN_USERNAME:mwitter-admin}
